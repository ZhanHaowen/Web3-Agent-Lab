name: Windows V0.18.3 verification

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-verification:
    name: Windows x64 compatibility and integration tests
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      LAB_TEST_ARTIFACT_DIR: artifacts/test-results/current
    steps:
      - name: Enable long paths for sealed evidence checkout
        run: git config --global core.longpaths true

      # Keep official actions on the v4 major pins used by the existing workflow.
      - name: Check out source without retaining push credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          architecture: x64

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated payment SDK dependencies
        run: pnpm run setup:research

      - name: Install isolated BNB SDK dependencies
        run: pnpm run setup:bnb

      - name: Prepare verified local Anvil and the Windows launcher runtime
        run: |
          node scripts/setup-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Anvil setup failed.' }
          $ciNodeExecutable = (node -p "process.execPath").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to locate setup-node runtime.' }
          Copy-Item -LiteralPath $ciNodeExecutable -Destination runtime/node.exe
          if (-not (Test-Path -LiteralPath runtime/anvil.exe -PathType Leaf)) {
            throw 'Expected Windows Anvil was not installed.'
          }

      - name: Run all 26 isolated regression phases including testnet adapters
        env:
          LAB_REGRESSION_OUT: artifacts/test-results/v0183-ci
        run: |
          node scripts/testnet-regression.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V0.18.3 inherited regression failed.' }
          $ciSummary = Get-Content artifacts/test-results/v0183-ci/summary.json -Raw | ConvertFrom-Json
          if (-not $ciSummary.passed -or $ciSummary.passedSteps -ne 26 -or $ciSummary.failedSteps -ne 0) {
            throw 'All 26 phases must pass; partial results cannot pass the release gate.'
          }

      - name: Verify budget policy constraints
        env:
          LAB_TEST_ARTIFACT_DIR: artifacts/test-results/v0183-ci/budget-constraints
          LAB_TEST_DATA_DIR: artifacts/test-results/v0183-ci/budget-constraints/data
        run: |
          node tests/budget-constraints.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V0.18.3 budget constraint regression failed.' }

      - name: Verify pending recovery and accepted quote binding on real local EVM
        env:
          LAB_TEST_ARTIFACT_DIR: artifacts/test-results
          LAB_PEER_CASES: ''
        run: |
          node tests/peer-recovery-regression.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V0.18.3 peer recovery regression failed.' }
          $peerSummaries = @(Get-ChildItem artifacts/test-results/peer-recovery/*/summary.json)
          if ($peerSummaries.Count -ne 1) { throw 'Expected exactly one peer recovery run.' }
          $peerSummary = Get-Content $peerSummaries[0].FullName -Raw | ConvertFrom-Json
          if ($peerSummary.records.Count -ne 13 -or @($peerSummary.records | Where-Object { $_.status -ne 'PASS' -or $_.cleanupErrors.Count -ne 0 }).Count -ne 0) {
            throw 'All 13 recovery cases and owned-process cleanup must pass.'
          }
          $ciBuild = Get-Content build-info.json -Raw | ConvertFrom-Json
          if ($peerSummary.buildHash -ne $ciBuild.sourceHash -or $ciBuild.version -ne '0.18.3') {
            throw 'Peer cases must run against the final V0.18.3 build.'
          }

      - name: Verify isolated BNB SDK offline experiment
        env:
          LAB_BNB_TEST_OUT: artifacts/test-results/v0183-ci/bnb-offline
        run: |
          node scripts/bnb-sdk-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'V0.18.3 BNB offline smoke failed.' }

      - name: Upload current CI logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-v0183-validation
          overwrite: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/v0183-ci/*.log
            artifacts/test-results/v0183-ci/summary.json
            artifacts/test-results/v0183-ci/budget-constraints/*.json
            artifacts/test-results/v0183-ci/bnb-offline/smoke-results.json
            artifacts/test-results/v0183-ci/results/*/*-results.json
            artifacts/test-results/v0183-ci/results/*/research/report.json
            artifacts/test-results/v0183-ci/results/*/testnet/report.json
            artifacts/test-results/v0183-ci/results/13-worker-shutdown-recovery/acceptance-final-recovery/supplement/summary.json
            artifacts/test-results/peer-recovery/*/summary.json
            artifacts/test-results/peer-recovery/*/P*.result.json

      # GUI browser checks and macOS runs are not performed by this job.
      # Historical release reports remain historical evidence, not CI results.
